# Checagem de tipos dos scripts do skill (o autoteste roda `mypy`). Fica fora da cópia feita nos
# projetos (COPY_IGNORE em scripts/devflow/bootstrap.py). Os testes ficam de fora: são unittest
# com mixins e fixtures dinâmicas, e a suíte já os exercita.
[mypy]
python_version = 3.11
files = scripts
check_untyped_defs = True
disallow_incomplete_defs = True
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True
